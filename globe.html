var stage=document.getElementById('stage'),world=document.getElementById('world');
var N=IMGS.length,D=1000,fov=75,P=600,dirs=[],els=[];
for(var i=0;i<N;i++){
  var y=1-2*(i+.5)/N,el=Math.asin(y),th=i*2.399963;
  var d=document.createElement('div');d.className='p';
  var im=new Image();im.src=IMGS[i];im.draggable=false;d.appendChild(im);
  d.style.transform='rotateY('+th+'rad) rotateX('+(-el)+'rad) translateZ(-'+D+'px)';
  world.appendChild(d);els.push(d);
  dirs.push([-Math.cos(el)*Math.sin(th),-Math.sin(el),-Math.cos(el)*Math.cos(th)]);
}
function setP(){P=(innerHeight/2)/Math.tan(fov*Math.PI/360);stage.style.perspective=P+'px';stage.style.webkitPerspective=P+'px'}
addEventListener('resize',setP);setP();
var yaw=0,pitch=0,vx=0,vy=0,drag=false,lx=0,ly=0;
function k(){return fov*Math.PI/180/innerHeight}
stage.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;vx=vy=0;try{stage.setPointerCapture(e.pointerId)}catch(_){}});
stage.addEventListener('pointermove',function(e){if(!drag)return;
  var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  vx=-dx*k();vy=dy*k();yaw+=vx;pitch+=vy});
function up(){drag=false}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
stage.addEventListener('wheel',function(e){e.preventDefault();fov=Math.min(100,Math.max(45,fov+e.deltaY*.05));setP()},{passive:false});
function loop(){
  requestAnimationFrame(loop);
  if(!drag){yaw+=vx;pitch+=vy;vx*=.95;vy*=.95;if(Math.abs(vx)<.0004&&Math.abs(vy)<.0004)yaw+=.0006}
  var L=Math.PI/2-.02;pitch=Math.max(-L,Math.min(L,pitch));
  world.style.transform='translateZ('+P+'px) rotateX('+pitch+'rad) rotateY('+yaw+'rad)';
  var f=[Math.cos(pitch)*Math.sin(yaw),-Math.sin(pitch),-Math.cos(pitch)*Math.cos(yaw)];
  for(var i=0;i<N;i++){var a=dirs[i],dot=a[0]*f[0]+a[1]*f[1]+a[2]*f[2];els[i].style.visibility=dot>.1?'visible':'hidden'}
  var s=(-yaw*P)+'px '+(pitch*P)+'px';stage.style.backgroundPosition=[s,s,s,s,s,s,'0 0'].join(',');
}
loop();
